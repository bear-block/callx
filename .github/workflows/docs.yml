name: Docs

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/docs.yml']
  workflow_dispatch:
  # Daily rebuild, so new sponsors appear on the site within a day.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # "Last updated" dates come from git history.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Fetches the sponsor list, then builds; VitePress fails the build on dead internal links.
      - run: npm run build
        env:
          SPONSORS_GITHUB_TOKEN: ${{ secrets.SPONSORS_GITHUB_TOKEN }}
          SPONSORS_BMC_TOKEN: ${{ secrets.SPONSORS_BMC_TOKEN }}
      - name: Check Pages deployment configuration
        id: pages
        uses: actions/github-script@v8
        if: github.event_name != 'pull_request'
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getPages(context.repo);
              const ready = data.build_type === 'workflow';
              core.setOutput('ready', String(ready));
              if (!ready) core.warning('Docs built. To deploy, set Settings → Pages → Source to GitHub Actions.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('ready', 'false');
              core.warning('Docs built; GitHub Pages is not enabled. Enable Settings → Pages → Source: GitHub Actions to publish the site.');
            }
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
