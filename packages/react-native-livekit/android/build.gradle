buildscript {
    ext.kotlin_version = "2.2.20"
    repositories { google(); mavenCentral() }
    dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "dev.callx.livekit"
    compileSdk = 36
    defaultConfig { minSdk = 29 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

repositories {
    google(); mavenCentral()
    // LiveKit's AudioSwitch fork.
    maven { url "https://jitpack.io"; content { includeGroup "com.github.davidliu" } }
}
dependencies {
    implementation "com.facebook.react:react-android"
    // The Callx core package, autolinked as :bear-block_callx.
    implementation project(":bear-block_callx")
    implementation "io.livekit:livekit-android:2.29.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}
