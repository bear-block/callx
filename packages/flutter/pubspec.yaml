name: callx
description: Native call coordination for Flutter using CallKit and Android Core-Telecom.
version: 0.0.0-preview.1
homepage: https://github.com/bear-block/callx
repository: https://github.com/bear-block/callx

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.callx.flutter
        pluginClass: CallxPlugin
      ios:
        pluginClass: CallxPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
