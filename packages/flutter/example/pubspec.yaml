name: callx_flutter_example
description: "Callx SDK example: in-memory simulator and native device trials."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  callx:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The plugin lives in packages/flutter, not a folder named callx. For a plugin's own
  # example, Flutter then registers the plugin's Swift package under two identities
  # and resolution fails, so this example builds iOS through CocoaPods. Apps that
  # depend on callx are unaffected and use Swift Package Manager by default.
  config:
    enable-swift-package-manager: false
