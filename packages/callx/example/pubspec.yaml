name: callx_flutter_example
description: "Callx SDK example: in-memory simulator and native device trials."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  callx:
    path: ../
  # The LiveKit media adapter: installing it is the whole integration (ADR-0009).
  callx_livekit:
    path: ../../callx_livekit
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Swift Package Manager: callx_livekit needs it, because LiveKit's Swift SDK ships only
  # through it. Flutter links plugins by their folder names, so packages/callx and
  # packages/callx_livekit are named after their packages.
  config:
    enable-swift-package-manager: true

# callx_livekit depends on callx by version; the monorepo uses the local package.
dependency_overrides:
  callx:
    path: ../
