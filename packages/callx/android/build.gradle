group = "dev.callx.flutter"
version = "0.1.3"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories { google(); mavenCentral() }
    dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
}

apply plugin: "com.android.library"

// AGP 9 compiles Kotlin itself unless android.builtInKotlin=false, and rejects the separate
// Kotlin plugin when it does. Older AGP and opted-out hosts still need the plugin applied.
def builtInKotlin = androidComponents.pluginVersion.major >= 9 &&
    (findProperty("android.builtInKotlin")?.toString()?.toBoolean() ?: true)
if (!builtInKotlin) pluginManager.apply("org.jetbrains.kotlin.android")

android {
    namespace = "dev.callx.flutter"
    compileSdk = 36
    defaultConfig { minSdk = 29 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation "androidx.core:core-telecom:1.0.1"
    implementation "androidx.core:core:1.13.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
}
