name: callx
description: Native call coordination for Flutter using CallKit and Android Core-Telecom.
version: 0.3.0
homepage: https://bear-block.github.io/callx/
repository: https://github.com/bear-block/callx/tree/main/packages/callx
issue_tracker: https://github.com/bear-block/callx/issues
documentation: https://bear-block.github.io/callx/
funding:
  - https://github.com/sponsors/bear-block
  - https://buymeacoffee.com/bearblock
topics:
  - voip
  - callkit
  - telecom
  - calls
  - push-notifications

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.callx.flutter
        pluginClass: CallxPlugin
      ios:
        pluginClass: CallxPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
