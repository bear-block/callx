group = "dev.callx.livekit"
version = "0.2.2"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories { google(); mavenCentral() }
    dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
}

apply plugin: "com.android.library"

// AGP 9 compiles Kotlin itself unless android.builtInKotlin=false (same rule as callx).
def builtInKotlin = androidComponents.pluginVersion.major >= 9 &&
    (findProperty("android.builtInKotlin")?.toString()?.toBoolean() ?: true)
if (!builtInKotlin) pluginManager.apply("org.jetbrains.kotlin.android")

android {
    namespace = "dev.callx.livekit"
    compileSdk = 36
    defaultConfig { minSdk = 29 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

repositories {
    google(); mavenCentral()
    // LiveKit's AudioSwitch fork.
    maven { url "https://jitpack.io"; content { includeGroup "com.github.davidliu" } }
}

dependencies {
    // The callx plugin project, as Flutter names it.
    implementation rootProject.findProject(":callx") ?: project(":callx")
    implementation "io.livekit:livekit-android:2.29.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}
