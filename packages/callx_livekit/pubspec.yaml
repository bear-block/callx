name: callx_livekit
description: LiveKit media adapter for callx. Call audio starts natively when a call is answered.
version: 0.1.1
homepage: https://bear-block.github.io/callx/
repository: https://github.com/bear-block/callx/tree/main/packages/callx_livekit
issue_tracker: https://github.com/bear-block/callx/issues
documentation: https://bear-block.github.io/callx/
funding:
  - https://github.com/sponsors/bear-block
  - https://buymeacoffee.com/bearblock
topics:
  - livekit
  - voip
  - callkit
  - telecom
  - webrtc

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # The monorepo resolves this to ../callx through pubspec_overrides.yaml.
  callx: ^0.1.1

flutter:
  plugin:
    platforms:
      android:
        package: dev.callx.livekit.flutter
        pluginClass: CallxLiveKitPlugin
      ios:
        pluginClass: CallxLiveKitPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
