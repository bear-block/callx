buildscript {
    ext.kotlin_version = "2.2.20"
    repositories { google(); mavenCentral() }
    dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
// Codegen: generates NativeCallxSpec from src/specs/NativeCallx.ts (package.json codegenConfig).
apply plugin: "com.facebook.react"

android {
    namespace = "dev.callx.reactnative"
    compileSdk = 36
    defaultConfig { minSdk = 29 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

react {
    jsRootDir = file("../src/specs")
    libraryName = "CallxSpec"
    codegenJavaPackageName = "dev.callx.reactnative"
}

repositories { google(); mavenCentral() }
dependencies {
    implementation "com.facebook.react:react-android"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-telecom:1.0.1"
    implementation "androidx.core:core:1.13.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
}
